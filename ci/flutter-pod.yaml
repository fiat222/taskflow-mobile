apiVersion: v1
kind: Pod
spec:
  containers:
    - name: flutter
      image: ghcr.io/cirruslabs/flutter:stable
      command: ['cat']
      tty: true
      # A hard limit makes an over-hungry Gradle kill only this pod, not the whole Docker VM.
      resources:
        requests: { memory: 3Gi, cpu: '1' }
        limits: { memory: 5Gi, cpu: '4' }
      volumeMounts:
        - { name: cache, mountPath: /cache }
    - name: osv
      image: ghcr.io/google/osv-scanner:v2.6.0
      command: ['cat']
      tty: true
      resources:
        limits: { memory: 512Mi }
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: flutter-cache
